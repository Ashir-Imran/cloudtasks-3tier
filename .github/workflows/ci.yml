name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt
      - name: Run unit tests
        working-directory: app
        run: pytest tests/test_unit.py -v

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase the owner name (GHCR requires lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER }}/cloudtasks-app:latest
            ghcr.io/${{ env.OWNER }}/cloudtasks-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/cloudtasks-web:latest
            ghcr.io/${{ env.OWNER }}/cloudtasks-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max