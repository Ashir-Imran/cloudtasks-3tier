name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt
      - name: Run unit tests
        working-directory: app
        run: pytest tests/test_unit.py -v

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase the owner name (GHCR requires lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER }}/cloudtasks-app:latest
            ghcr.io/${{ env.OWNER }}/cloudtasks-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/cloudtasks-web:latest
            ghcr.io/${{ env.OWNER }}/cloudtasks-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Rolling update (app tier, then web tier)
        run: |
          refresh() {
            ASG="$1"
            ID=$(aws autoscaling start-instance-refresh \
              --auto-scaling-group-name "$ASG" \
              --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":180}' \
              --query InstanceRefreshId --output text)
            echo "Started refresh $ID on $ASG"
            for i in $(seq 1 90); do
              STATUS=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "$ASG" --instance-refresh-ids "$ID" \
                --query 'InstanceRefreshes[0].Status' --output text)
              echo "$ASG: $STATUS"
              case "$STATUS" in
                Successful) return 0 ;;
                Failed|Cancelled|RollbackFailed|RollbackSuccessful) return 1 ;;
              esac
              sleep 20
            done
            return 1
          }
          refresh cloudtasks-app-asg
          refresh cloudtasks-web-asg