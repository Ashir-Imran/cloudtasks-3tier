<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudTasks</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">&#9729;</span> CloudTasks</div>
  <div id="userbox" class="userbox" hidden>
    <span id="username"></span>
    <button id="logout" class="btn ghost">Log out</button>
  </div>
</header>

<main>
  <!-- AUTH -->
  <section id="auth-view" class="card auth">
    <div class="tabs">
      <button class="tab active" data-mode="login">Log in</button>
      <button class="tab" data-mode="register">Create account</button>
    </div>
    <form id="auth-form" autocomplete="on">
      <label id="name-row" hidden>Name<input id="a-name" type="text" maxlength="100" autocomplete="name"></label>
      <label>Email<input id="a-email" type="email" required autocomplete="email"></label>
      <label>Password<input id="a-pass" type="password" minlength="8" maxlength="128" required autocomplete="current-password"></label>
      <div id="auth-err" class="err" hidden></div>
      <button class="btn primary" type="submit" id="auth-submit">Log in</button>
    </form>
    <p class="hint">Three-tier demo: Nginx &rarr; Flask &rarr; PostgreSQL, files in S3.</p>
  </section>

  <!-- APP -->
  <section id="app-view" hidden>
    <div class="stats">
      <div class="stat"><div class="num" data-stat="total">0</div><div class="lbl">Total</div></div>
      <div class="stat"><div class="num" data-stat="todo">0</div><div class="lbl">To do</div></div>
      <div class="stat"><div class="num" data-stat="in_progress">0</div><div class="lbl">In progress</div></div>
      <div class="stat"><div class="num" data-stat="done">0</div><div class="lbl">Done</div></div>
      <div class="stat warn"><div class="num" data-stat="overdue">0</div><div class="lbl">Overdue</div></div>
    </div>

    <div class="card">
      <div class="toolbar">
        <input id="f-q" type="search" placeholder="Search tasks..." maxlength="100">
        <select id="f-status">
          <option value="">All statuses</option>
          <option value="todo">To do</option>
          <option value="in_progress">In progress</option>
          <option value="done">Done</option>
        </select>
        <select id="f-priority">
          <option value="">Any priority</option>
          <option value="3">High</option>
          <option value="2">Medium</option>
          <option value="1">Low</option>
        </select>
        <button id="new-task" class="btn primary">+ New task</button>
      </div>
      <ul id="tasks" class="tasks"></ul>
      <div class="pager">
        <button id="prev" class="btn ghost">&larr; Prev</button>
        <span id="page-info"></span>
        <button id="next" class="btn ghost">Next &rarr;</button>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <span><i id="dot-db" class="dot"></i>Database: <b id="st-db">...</b></span>
  <span><i id="dot-s3" class="dot"></i>Storage: <b id="st-s3">...</b></span>
  <span>Served by: <b id="st-host">...</b></span>
</footer>

<dialog id="task-dialog">
  <form id="task-form">
    <h2 id="dlg-title">New task</h2>
    <label>Title<input id="t-title" type="text" maxlength="200" required></label>
    <label>Description<textarea id="t-desc" rows="3" maxlength="2000"></textarea></label>
    <div class="row">
      <label>Priority
        <select id="t-pri"><option value="1">Low</option><option value="2" selected>Medium</option><option value="3">High</option></select>
      </label>
      <label>Status
        <select id="t-status"><option value="todo">To do</option><option value="in_progress">In progress</option><option value="done">Done</option></select>
      </label>
      <label>Due date<input id="t-due" type="date"></label>
    </div>
    <div id="att-box" hidden>
      <h3>Attachments</h3>
      <ul id="att-list" class="atts"></ul>
      <input id="att-file" type="file" accept=".png,.jpg,.jpeg,.gif,.pdf,.txt">
      <div class="hint">PNG, JPG, GIF, PDF or TXT, up to 5 MB.</div>
    </div>
    <div id="dlg-err" class="err" hidden></div>
    <div class="actions">
      <button type="button" id="dlg-delete" class="btn danger" hidden>Delete</button>
      <span class="spacer"></span>
      <button type="button" id="dlg-cancel" class="btn ghost">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
